spring:
  application:
    name: banca
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    # Los importes BigDecimal se escriben sin notación científica (p. ej. 1500.00, no 1.5E+3).
    generator:
      write-bigdecimal-as-plain: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # Solo para desarrollo. En producción se debe definir JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  idempotency:
    # Tiempo durante el cual una Idempotency-Key reutilizada devuelve el resultado original.
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  seed:
    # Carga clientes, cuentas y movimientos FICTICIOS si la base está vacía.
    enabled: ${SEED_DEMO_DATA:true}
    demo-password: ${DEMO_PASSWORD:Demo1234!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:banca;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banca}
    username: ${DB_USERNAME:banca}
    password: ${DB_PASSWORD}
